name: CuttingBoardCare
options:
  bundleIdPrefix: com.shimondeitel.boardcare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  CuttingBoardCare:
    type: application
    platform: iOS
    sources:
      - path: CuttingBoardCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.boardcare
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: CuttingBoardCare/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  CuttingBoardCareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CuttingBoardCareTests
      - path: CuttingBoardCare.storekit
    dependencies:
      - target: CuttingBoardCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.boardcare.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  CuttingBoardCareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CuttingBoardCareUITests
    dependencies:
      - target: CuttingBoardCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.boardcare.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  CuttingBoardCare:
    build:
      targets:
        CuttingBoardCare: all
        CuttingBoardCareTests: [test]
        CuttingBoardCareUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: CuttingBoardCare.storekit
    test:
      config: Debug
      storeKitConfiguration: CuttingBoardCare.storekit
      targets:
        - CuttingBoardCareTests
        - CuttingBoardCareUITests
    archive:
      config: Release
